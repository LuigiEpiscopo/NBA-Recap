name: Aggiorna catalogo NBA

on:
  workflow_dispatch:
  # GitHub Actions usa UTC. Quattro finestre offrono un tentativo
  # principale e uno di recupero per ciascun aggiornamento,
  # sia durante l'ora solare sia durante l'ora legale italiana.
  # Ora solare (CET): 05:37, 06:37, 08:37, 09:37
  # Ora legale (CEST): 06:37, 07:37, 09:37, 10:37
  schedule:
    - cron: '37 4,5,7,8 * * *'

permissions:
  contents: write

concurrency:
  group: nba-catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa yt-dlp
        run: python -m pip install -U yt-dlp

      - name: Aggiorna catalogo
        run: python scripts/update_catalog.py

      - name: Salva catalogo aggiornato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json

          if git diff --cached --quiet; then
            echo "Catalogo invariato"
            exit 0
          fi

          git commit -m "Aggiorna catalogo NBA"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Catalogo pubblicato correttamente"
              exit 0
            fi

            echo "Tentativo $attempt fallito, riprovo..."
            sleep 5
          done

          echo "Impossibile pubblicare il catalogo"
          exit 1
