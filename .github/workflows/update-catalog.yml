
name: Aggiorna catalogo NBA

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Aggiorna catalogo
        run: python scripts/update_catalog.py

      - name: Salva catalogo aggiornato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git diff --cached --quiet || git commit -m "Aggiorna catalogo NBA"
          git push
