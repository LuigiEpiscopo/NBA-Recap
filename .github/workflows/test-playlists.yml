
name: Test playlist NBA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa yt-dlp
        run: python -m pip install -U yt-dlp

      - name: Verifica playlist
        run: python scripts/test_playlists.py
