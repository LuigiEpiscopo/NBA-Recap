<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>NBA Recap — Test Ximo Pierto</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{background:#0e1015;color:#f4f5f7;margin:0;padding:24px 16px;line-height:1.5}
    main{max-width:760px;margin:auto}h1{font-size:1.5rem;margin-bottom:.3rem}
    p{color:#b9beca} .player{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .note{font-size:.9rem}a{color:#b9ef5d}button{border:1px solid #555b67;border-radius:9px;padding:12px 16px;background:#20252f;color:#fff;font:inherit;margin:8px 8px 8px 0;cursor:pointer}
    button[aria-pressed=true]{background:#b9ef5d;color:#101418;border-color:#b9ef5d}
  </style>
</head>
<body><main>
  <h1>🏀 NBA Recap — Test Ximo Pierto</h1>
  <p>Video di prova: <strong>4cXUpUfkQEQ</strong>. Apri questa pagina da GitHub Pages, senza VPN, poi premi Play nel riquadro.</p>
  <div class="player"><iframe id="video" title="Test video Ximo Pierto" src="https://www.youtube-nocookie.com/embed/4cXUpUfkQEQ?playsinline=1&amp;rel=0" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
  <p class="note">Se compare un errore, prova l'altro dominio di incorporamento:</p>
  <button id="nocookie" aria-pressed="true" onclick="setPlayer('nocookie')">youtube-nocookie.com</button>
  <button id="standard" aria-pressed="false" onclick="setPlayer('standard')">youtube.com</button>
  <p class="note">Se nessuno dei due funziona, segnala il codice di errore. Il video originale è <a href="https://www.youtube.com/watch?v=4cXUpUfkQEQ">qui su YouTube</a>.</p>
</main>
<script>
function setPlayer(mode){
  const domain=mode==='nocookie'?'www.youtube-nocookie.com':'www.youtube.com';
  document.getElementById('video').src='https://'+domain+'/embed/4cXUpUfkQEQ?playsinline=1&rel=0';
  document.getElementById('nocookie').setAttribute('aria-pressed',String(mode==='nocookie'));
  document.getElementById('standard').setAttribute('aria-pressed',String(mode==='standard'));
}
</script></body></html>
